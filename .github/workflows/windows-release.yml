name: Windows Release

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Install Python package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller desktop/VouchPilot.spec --noconfirm

      - name: Package release
        shell: pwsh
        run: |
          $out = "release"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "dist/VouchPilot.exe" "$out/VouchPilot.exe"
          Copy-Item "desktop/INSTALL.md" "$out/INSTALL.md"
          $hash = (Get-FileHash "$out/VouchPilot.exe" -Algorithm SHA256).Hash
          "$hash  VouchPilot.exe" | Set-Content "$out/SHA256SUMS.txt"
          Compress-Archive -Path "$out/*" -DestinationPath "VouchPilot-Windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VouchPilot-Windows
          path: VouchPilot-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "VouchPilot-Windows.zip" --title "VouchPilot ${{ github.ref_name }}" --generate-notes
