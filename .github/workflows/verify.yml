name: Verify

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pip wheel --no-deps . -w /tmp/vouchpilot-wheel
      - run: python -m venv /tmp/vouchpilot-venv
      - run: /tmp/vouchpilot-venv/bin/pip install --no-deps /tmp/vouchpilot-wheel/*.whl
      - run: /tmp/vouchpilot-venv/bin/python -c "import vouch_engine, extensions.vouchpilot_scorer; print(vouch_engine.__version__)"
      - run: ruff check src extensions app.py pilot.py --select E4,E7,E9,F,I

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test src/review.test.ts src/api.test.ts src/storage.test.ts
      - run: npm run build


  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: vouchpilot:ci
