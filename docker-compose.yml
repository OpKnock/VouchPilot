# VouchPilot web runtime. Keyword/VouchPilot+ work without a model server.
# Add the optional LLM service with: docker compose --profile llm up --build
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      VOUCH_LLM_ENDPOINT: http://llm:8080

  llm:
    profiles: ["llm"]
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command:
      [
        "-m",
        "/models/Qwen3.5-4B-Q4_K_M.gguf",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "-c",
        "4096",
        "--n-gpu-layers",
        "99"
      ]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
