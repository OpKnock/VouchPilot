# VouchPilot offline runtime: API + premium web UI served from one process,
# plus a local llama.cpp model server. Weights are mounted, never baked in.
# 1. python scripts/fetch_model.py --out models   (GGUF weights)
# 2. cd web && npm install && npm run build && cd ..
# 3. docker compose up --build
services:
  llm:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command: ["-m", "/models/Qwen3.5-4B-Q4_K_M.gguf", "--host", "0.0.0.0",
              "--port", "8080", "-c", "4096", "--n-gpu-layers", "99"]

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - llm
    environment:
      - VOUCH_LLM_ENDPOINT=http://llm:8080
