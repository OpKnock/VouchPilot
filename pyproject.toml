[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch-engine"
version = "0.1.0"
description = "VouchIQ VouchEngine: offline voucher classification for Indian accounting data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
    "pydantic>=2",
    "rapidfuzz",
    "scikit-learn",
    "streamlit",
    "huggingface_hub",
    "fastapi",
    "uvicorn",
    "pymupdf",
    "pypdfium2",
    "Pillow",
    "pytesseract",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
