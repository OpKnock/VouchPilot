[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch-engine"
version = "0.2.1"
description = "VouchIQ VouchEngine: offline voucher classification for Indian accounting data"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
    "pydantic>=2",
    "rapidfuzz",
    "scikit-learn",
    "streamlit",
    "huggingface_hub",
    "fastapi",
    "uvicorn",
    "pymupdf",
    "pypdfium2",
    "Pillow",
    "pytesseract",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src", "extensions" = "extensions", "extensions.reconcile_zenml" = "extensions/reconcile_zenml"}
packages = ["vouch_engine", "extensions", "extensions.reconcile_zenml"]

[tool.setuptools.package-data]
"extensions.reconcile_zenml" = ["config.yaml"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
